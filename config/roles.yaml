# gpu-broker role configuration.
#
# Each role is a worker the broker may start, stop, evict, or pin.
# VRAM numbers are calibrated against an NVIDIA GeForce RTX 3090 (24 GiB,
# GA102, sm_86). Encoder figures carry over unchanged from the GTX 1070
# calibration of 2026-05-28 -- they are model-footprint bound, not card bound,
# and were re-verified against the 3090 by smoke test on 2026-08-07.
#
# Schema:
#   image:                   docker image tag
#   port:                    host port the worker listens on (inside container,
#                            broker maps via --publish)
#   loaded_mb:               steady-state VRAM held when model is resident
#   activation_mb_estimate:  additional VRAM at active-inference peak (max
#                            observed in Phase 1 measurements)
#   idle_shutdown_seconds:   how long after last request to stop the container
#                            (0 = never; null = always-on)
#   co_resident_with:        roles known to safely share VRAM with this one
#   implies:                 acquiring this role also warms these roles
#                            (e.g. rerank implies embed)
#   evict_on_acquire:        before starting this role, evict these others
#   default_extra_args:      args appended to the container's exec command
#   enabled:                 false = role is declared but the broker won't
#                            start it (lifecycle defined for later)
#
# ---------------------------------------------------------------------------
# THE 24 GiB CO-RESIDENCY MODEL (changed 2026-08-07, was 8 GiB)
#
# On the 1070 every role fought for 7.5 GiB and eviction was load-bearing. On
# the 3090 all three encoders co-reside permanently (~8.9 GiB at simultaneous
# peak, and transcribe's 5.8 GiB is bursty). Eviction survives for ONE case:
# the large LLM profile, which cannot fit alongside anything.
#
# Two LLM roles are defined deliberately -- they are not alternatives, they are
# the two arms of the extraction eval and both must exist to run it:
#
#   llm_small  Profile A -- ~6-8.5 GiB model CO-RESIDENT with the full encoder
#              stack. Supports the LightRAG/Cognee extraction loop end to end
#              with real KV headroom. Candidates: Bonsai 27B ternary (~6-7 GiB),
#              Ornith-1.0-9B Dense (~6 GiB), Gemma 4 12B (~8 GiB, the trainable
#              QLoRA target).
#
#   llm_large  Profile B -- ~18-21 GiB model in EXCLUSIVE residency. Higher
#              single-model ceiling; the pipeline becomes sequential. Candidates:
#              Gemma 4 31B QAT (~18 GiB), Qwen3.6-27B dense (~17 GiB),
#              Laguna XS 2.1 (20.27 GiB), Ornith-35B MoE (~20 GiB).
#
# Second-card plan: when a second GPU lands, embed/rerank/transcribe move to it
# and the Profile A/B tradeoff dissolves -- the 3090 is then free for llm_large
# permanently. Noted exception, untested and speculative: running Bonsai on the
# SMALL card concurrently with a large model on the 3090, for local agentic
# work. That is a note, not a plan -- no tests have been run.
#
# Landscape, candidate table, quantization traps and revisit triggers:
#   Mind/projects/active/gpu-broker-upgrade/context/3090-model-landscape-2026-08.md
# ---------------------------------------------------------------------------

roles:

  embed:
    # Pinned 2026-08-28 to the intended two-card layout (encoders on the
    # 5060 Ti, LLM on the 3090). Safe to state now even though only one
    # card is installed: a selector that matches nothing falls back to
    # the SOLE installed card (gpu_ledger.resolve_placement), so this
    # works unchanged on a 5060-Ti-only box, a 3090-only box, or both.
    gpu_selector: "5060 Ti"
    image: gpu-broker/tei-embed:0.2.0
    port: 8081
    loaded_mb: 1200
    activation_mb_estimate: 400
    idle_shutdown_seconds: 300
    co_resident_with: [rerank, transcribe, llm_small]
    enabled: true

  rerank:
    # Pinned 2026-08-28 to the intended two-card layout (encoders on the
    # 5060 Ti, LLM on the 3090). Safe to state now even though only one
    # card is installed: a selector that matches nothing falls back to
    # the SOLE installed card (gpu_ledger.resolve_placement), so this
    # works unchanged on a 5060-Ti-only box, a 3090-only box, or both.
    gpu_selector: "5060 Ti"
    image: gpu-broker/bge-reranker:0.2.0
    port: 8082
    loaded_mb: 1200
    activation_mb_estimate: 300
    idle_shutdown_seconds: 300
    co_resident_with: [embed, transcribe, llm_small]
    implies: [embed]
    enabled: true

  transcribe:
    # Pinned 2026-08-28 to the intended two-card layout (encoders on the
    # 5060 Ti, LLM on the 3090). Safe to state now even though only one
    # card is installed: a selector that matches nothing falls back to
    # the SOLE installed card (gpu_ledger.resolve_placement), so this
    # works unchanged on a 5060-Ti-only box, a 3090-only box, or both.
    gpu_selector: "5060 Ti"
    image: gpu-broker/whisperx-server:0.2.1
    port: 8083
    loaded_mb: 0            # lazy on /acquire; no always-on residency
    activation_mb_estimate: 5800
    idle_shutdown_seconds: 30
    co_resident_with: [embed, rerank, llm_small]
    # evict_on_acquire: [rerank]   <- REMOVED 2026-08-07. On 8 GiB, acquiring
    #   transcribe had to tear down the reranker. On 24 GiB there is room for
    #   both, and evicting a warm model to free space that already exists is
    #   pure cost. Observed live in the 2026-08-07 smoke test, which evicted
    #   rerank for no reason.
    default_extra_args:
      - "--batch_size"
      - "16"
      # Was 4 -- a GTX 1070 OOM workaround (16 and 18 both OOM'd on Spanish
      # content, therapy-corpus checklist). Not a quality setting; it is a
      # throughput/VRAM tradeoff, so 24 GiB lifts it. NEEDS VALIDATION on a
      # real Spanish transcription before the therapy corpus relies on it --
      # if it regresses, drop to 8 rather than back to 4.
    enabled: true

  # --- Profile A: co-resident small model ---------------------------------
  #
  # Both LLM roles run the stock ollama/ollama image, which bundles its own
  # CUDA userspace and is therefore completely unaffected by the CUDA 11.8
  # Pascal pin the encoder images carry. Container CUDA is per-image; only the
  # host DRIVER (580, CUDA 13-capable) is shared.
  #
  # Ollama is itself a model manager with its own lifecycle, so without care
  # there are two layers doing the same job and the broker's VRAM ledger
  # becomes fiction. Resolved by: one container PER PROFILE (not one shared
  # server), OLLAMA_MAX_LOADED_MODELS=1 so a container never holds more than
  # the ledger accounts for, and OLLAMA_KEEP_ALIVE=-1 so ollama never unloads
  # underneath the broker. The broker owns the card; ollama owns model swapping
  # inside its own slice.
  #
  # Both mount the SAME model store: a model pulled once serves either profile,
  # and they are mutually exclusive so there is no concurrent write.
  llm_small:
    image: ollama/ollama:latest
    port: 8084
    # MEASURED 2026-08-07 via `ollama ps`, not inferred from download size --
    # that mistake is why this was briefly 8500. Resident VRAM includes the KV
    # cache, so it far exceeds the file on disk, and the gap grows with context:
    #
    #   model             disk   32k/f16  16k/f16  16k/q8_0  32k/q8_0
    #   ornith:9b         5.6 GB   6.4 GB   5.9 GB   5.6 GB    6.0 GB
    #   qwen3:8b          5.2 GB  10.0 GB   7.5 GB   6.4 GB    7.7 GB
    #   gemma4:12b        7.6 GB   8.4 GB   8.4 GB   8.1 GB    8.1 GB
    #   mistral-nemo:12b  7.1 GB  12.0 GB   9.6 GB   8.4 GB    9.7 GB  <- worst
    #
    # The q8_0 column is why context went back to 32k: 32k with q8_0 KV costs
    # 9.7 GB where 16k with f16 KV cost 9.6 GB. Double the context for 0.1 GB.
    #
    # At the 32k default, mistral-nemo alone exceeded this role's entire budget
    # and the ledger silently stopped describing reality. Capped to 16k (see
    # OLLAMA_CONTEXT_LENGTH below) and sized to the measured worst case.
    loaded_mb: 9800          # mistral-nemo:12b @ 32k + q8_0 KV = 9.7 GB measured
    activation_mb_estimate: 1200   # headroom over resident; ps SIZE already
                                   # includes KV, so this is generation slack
    idle_shutdown_seconds: 900
    co_resident_with: [embed, rerank, transcribe]
    evict_on_acquire: [llm_large]
    # Does NOT evict the encoders -- that is the entire point of Profile A.
    # It does evict llm_large, which would otherwise hold the whole card and
    # make this acquire fail on budget rather than succeed.
    # Worst case with every encoder at simultaneous peak:
    #   embed 1600 + rerank 1500 + transcribe 5800 + llm_small 11000 = 19.9 GiB
    # against a 23.0 GiB budget. Fits with ~3.1 GiB spare. (Totals unchanged by
    # the 2026-08-07 re-measure -- the 8500/2500 split was wrong but the 11000
    # sum happened to be right; it is now 9600/1400 and derived from
    # measurement rather than luck.)
    gpu_selector: "3090"     # by NAME, never an index -- see config.py
    volumes:
      /opt/fast/ollama: /root/.ollama
    env:
      OLLAMA_HOST: "0.0.0.0:8084"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "-1"
      # Cap context. Ollama defaults to 32768, and KV cache at that depth is
      # what makes resident VRAM far exceed download size (mistral-nemo:12b is
      # 7.1 GB on disk but 12 GB resident at 32k). Extraction works on chunks;
      # 16k holds a chunk plus schema plus few-shot plus the JSON output with
      # room to spare. Raise deliberately and re-measure, never by default.
      OLLAMA_CONTEXT_LENGTH: "32768"
      # q8_0 KV cache. MEASURED 2026-08-07 against f16 at the same 16k context:
      #   mistral-nemo:12b  9.6 -> 8.4 GB   qwen3:8b    7.5 -> 6.4 GB
      #   gemma4:12b        8.4 -> 8.1 GB   ornith:9b   5.9 -> 5.6 GB
      # Savings scale with KV size, so long-context architectures gain most.
      # q8_0 is near-lossless; q4_0 is NOT -- it degrades the way the landscape
      # doc's quantization warning describes, so do not "optimize" further.
      # Flash attention already auto-enables, but pin it: q8_0 KV silently
      # requires it, and relying on an "auto" for a correctness precondition is
      # how this breaks quietly on some future model.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      # n_slots is 1 today, so KV is allocated once. Raising NUM_PARALLEL for
      # extraction throughput multiplies KV by exactly that factor -- re-measure
      # and re-size loaded_mb before doing it.
      OLLAMA_NUM_PARALLEL: "1"
    health_path: "/"        # ollama has no /healthz; "/" answers 200
    enabled: true

  # --- Profile B: exclusive large model ------------------------------------
  llm_large:
    image: ollama/ollama:latest
    port: 8085
    loaded_mb: 21000         # covers the ~20 GiB class incl. KAT-Coder at 21 GiB
    activation_mb_estimate: 2000
    idle_shutdown_seconds: 600
    evict_on_acquire: [embed, rerank, transcribe, llm_small]
    # 21000 + 2000 = 23.0 GiB against a 23.0 GiB budget -- this role owns the
    # card outright. Retrieval is unavailable while it is resident, which is
    # the defining cost of Profile B.
    gpu_selector: "3090"
    volumes:
      /opt/fast/ollama: /root/.ollama
    env:
      OLLAMA_HOST: "0.0.0.0:8085"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "-1"
      # Cap context. Ollama defaults to 32768, and KV cache at that depth is
      # what makes resident VRAM far exceed download size (mistral-nemo:12b is
      # 7.1 GB on disk but 12 GB resident at 32k). Extraction works on chunks;
      # 16k holds a chunk plus schema plus few-shot plus the JSON output with
      # room to spare. Raise deliberately and re-measure, never by default.
      OLLAMA_CONTEXT_LENGTH: "32768"
      # q8_0 KV cache. MEASURED 2026-08-07 against f16 at the same 16k context:
      #   mistral-nemo:12b  9.6 -> 8.4 GB   qwen3:8b    7.5 -> 6.4 GB
      #   gemma4:12b        8.4 -> 8.1 GB   ornith:9b   5.9 -> 5.6 GB
      # Savings scale with KV size, so long-context architectures gain most.
      # q8_0 is near-lossless; q4_0 is NOT -- it degrades the way the landscape
      # doc's quantization warning describes, so do not "optimize" further.
      # Flash attention already auto-enables, but pin it: q8_0 KV silently
      # requires it, and relying on an "auto" for a correctness precondition is
      # how this breaks quietly on some future model.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      # n_slots is 1 today, so KV is allocated once. Raising NUM_PARALLEL for
      # extraction throughput multiplies KV by exactly that factor -- re-measure
      # and re-size loaded_mb before doing it.
      OLLAMA_NUM_PARALLEL: "1"
    health_path: "/"        # ollama has no /healthz; "/" answers 200
    enabled: true

# Host-level constraints
gpu:
  # PER-GPU LEDGER (2026-08-28). Replaces the old global `total_mb` /
  # `reserved_for_host_mb` pair.
  #
  # Why it changed: `total_mb` was a hand-maintained number nobody reconciled
  # against the hardware. On 2026-08-27 it still read 24576 -- an RTX 3090 that
  # had been swapped out -- while the installed card was a 16311 MiB RTX 5060
  # Ti. Nothing detected it for the life of the swap, and /status made it worse
  # by reporting gpu_total_mb from THIS FILE while reporting gpu_used_mb from
  # nvidia-smi in the adjacent field, so the endpoint that should have exposed
  # the drift confirmed it instead.
  #
  # The split now enforced:
  #   MEASURED from the card  -> total_mb, uuid, name   (NOT configurable here)
  #   POLICY from this file   -> reserved_for_host_mb
  #
  # There is deliberately no `total_mb` key. A config file cannot have an
  # opinion about how much VRAM is soldered to a board; letting it have one is
  # precisely how the drift above happened.
  #
  # Keys are matched like `gpu_selector`: a full UUID, or a case-insensitive
  # substring of the card NAME. Never an index. An entry whose card is not
  # installed is simply INACTIVE -- which is how the 3090 entry sits dormant
  # below while the 5060 Ti is in the box, and why swapping the cards back
  # requires no edit to this file. An installed card with NO entry is a hard
  # startup failure, not a default: a card the broker cannot budget is a card
  # it will over-commit.
  cards:

    "3090":
      reserved_for_host_mb: 1024
      # Was 8192 / 700 for the GTX 1070. The old 700 MiB was justified as
      # "X server / desktop overhead" -- that justification is void: the
      # display runs on the iGPU and X does not touch this card at all (idle
      # 1 MiB / 27 W, AutoAddGPU off). What remains is ~400 MiB driver reserve
      # plus a per-process CUDA context of ~300 MiB, charged once per resident
      # worker. 1024 covers the driver reserve with fragmentation headroom.
      #
      # Effective budget when installed: 24576 - 1024 = 23552 MiB (was 7492).
      # Usable VRAM is ~23.3 GiB, not 24 -- plan against ~23 GiB and leave the
      # last GiB for fragmentation. Do not size a role to the full budget.
      #
      # RE-MEASURED ON SCULLY 2026-08-27 -- value CONFIRMED, do not lower it.
      # It is tempting to cut this now that the display tax is provably zero,
      # but that saving was ALREADY taken when this went 700 -> 1024: the 1024
      # is driver reserve + fragmentation headroom, NOT desktop overhead.
      #
      # Measured idle, nothing resident:  total 24576 | used 15 | free 24110
      #   -> 24576 - 15 - 24110 = 451 MiB the driver holds back and never
      #      reports as "used". That is the "~400 MiB driver reserve",
      #      confirmed.
      #   -> 15 MiB is the entire cost of the desktop being elsewhere. Already
      #      accounted for; there is nothing left to reclaim from it.
      # Trimming 1024 -> ~640 would recover ~384 MiB, unlock no new model tier,
      # and spend exactly the fragmentation headroom asked for above.
      #
      # Full reasoning + the soak that produced these numbers:
      # Mind/projects/active/self-hosted-brain-sovereignty/decisions.md
      #   § "acpi_enforce_resources=lax makes SMBus RGB tooling a RAM-corruption
      #      risk on Scully (2026-08-27)" -> subsection "3090 acceptance re-run".

    "5060 Ti":
      reserved_for_host_mb: 1024
      # Measured the same way on 2026-08-27, idle:
      #   total 16311 | driver holds back 16311 - used - free = 462 MiB
      # Within 11 MiB of the 3090's 451, which is the expected result: the
      # driver reserve is a near-constant, not a proportion of card size. The
      # same 1024 policy therefore carries -- ~460 driver + ~560 fragmentation
      # headroom -- because headroom is ABSOLUTE, not proportional. It does not
      # shrink just because the card is smaller.
      #
      # Effective budget when installed: 16311 - 1024 = 15287 MiB.
      # Consequence worth knowing before it surprises anyone: llm_large
      # (21000 + 2000) does not fit this card at all, and llm_small
      # (9800 + 1200) fits only if the encoders are not co-resident
      # (1600 + 1500 + 5800 = 8900). Both llm roles pin gpu_selector: 3090,
      # so today they refuse to start here rather than OOM -- which is correct.
